name: Freedom Browser

on:
  push:
    paths:
      - "freedom-browser/**"
      - ".github/workflows/freedom-browser.yml"
  pull_request:
    paths:
      - "freedom-browser/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: freedom-browser

jobs:
  android:
    name: Android (tests + APKs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 37.1
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" > /dev/null
      - name: Unit tests (shared + Android, incl. Robolectric UI rendering)
        run: ./gradlew --console=plain :shared:jvmTest :androidApp:testDebugUnitTest
      - name: Build APKs
        run: ./gradlew --console=plain :androidApp:assembleDebug :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            freedom-browser/shared/build/test-results
            freedom-browser/androidApp/build/test-results
            freedom-browser/androidApp/build/outputs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: freedom-android-apks
          path: |
            freedom-browser/androidApp/build/outputs/apk/debug/*.apk
            freedom-browser/androidApp/build/outputs/apk/release/*.apk

  windows-x86:
    name: Windows x86 (cross-build, verify PE32, package)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-i686 binutils-mingw-w64-i686 nsis zip file
      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: freedom-browser/build-cache
          key: cef-158.0.6-windows32
      - name: Build portable ZIP + installer
        run: scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: freedom-windows-x86
          path: |
            freedom-browser/dist/FreedomBrowser-*-windows-x86-portable.zip
            freedom-browser/dist/FreedomBrowser-*-windows-x86-setup.exe
            freedom-browser/dist/SHA256SUMS-windows.txt
            freedom-browser/dist/windows-x86-verification.txt
            freedom-browser/dist/windows-build.log
